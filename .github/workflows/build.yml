# Builds Emulon X in the cloud on every push.
# Download the finished plugin from the run's "Artifacts" section on GitHub.
# Pushing a tag like v1.2.0ea (Emulon X), sd-v0.1af (Emulon X SD) or hub-v0.1af (Emulon X Hub) also publishes
# a GitHub Release with that program's downloads. The Hub finds them there by the tag's start.
name: Build

on:
  push:
    branches: [ main ]
    # v1.2.0ea = Emulon X, sd-v0.1af = Emulon X SD, hub-v0.1af = Emulon X Hub (each publishes its own release)
    tags: [ "v*", "sd-v*", "hub-v*" ]
    # Text-only changes don't need a new build: the Hub's texts and pictures (hub folder), the docs folder
    # and any .md file (README, notes...). A commit that also changes code still builds. Tags always build.
    paths-ignore: [ "hub/**", "docs/**", "**.md" ]
  pull_request:
    paths-ignore: [ "hub/**", "docs/**", "**.md" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.4-windows-v2

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DEMX_BUILD_TESTS=ON 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $t = ((Get-Content configure.log -Tail 40) -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error title=Configure failed::$t"; exit 1 }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Select-String -Path build.log -Pattern ' error |error C|error LNK|CMake Error' | Select-Object -First 40 | ForEach-Object { $_.Line }
            $t = ($lines -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error title=Build failed::$t"; exit 1 }

      - name: Engine tests
        shell: pwsh
        run: |
          & "build/EmulonXTests_artefacts/Release/EmulonXTests.exe" 2>&1 | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -ne 0) {
            $t = ((Select-String -Path tests.log -Pattern '^FAIL' | ForEach-Object { $_.Line }) -join "`n").Replace('%','%25').Replace("`n",'%0A')
            Write-Output "::error title=Engine tests failed::$t"; exit 1 }
          & "build/EmulonXTests_artefacts/Release/EmulonXTests.exe" --bench

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/EmulonX_artefacts/Release/VST3/Emulon X.vst3" "dist/Emulon X.vst3"
          Copy-Item "build/EmulonX_artefacts/Release/Standalone/Emulon X.exe" "dist/Emulon X.exe"
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath EmulonX-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EmulonX-Windows
          path: dist/

      - name: Emulon X SD (skin designer) - self-test and files
        shell: pwsh
        run: |
          $exe = "build/EmulonXSD_artefacts/Release/Emulon X SD.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test", "sd-selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Output "::error title=Emulon X SD self-test failed::exit code $($p.ExitCode) - see the EmulonX-SD-Screenshots artifact"; $failed = $true }
          New-Item -ItemType Directory -Force sd-dist | Out-Null
          Copy-Item $exe "sd-dist/Emulon X SD.exe"
          Copy-Item LICENSE sd-dist/
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: EmulonX-SD-Windows
          path: sd-dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EmulonX-SD-Screenshots
          path: sd-selftest/

      - name: Build installer
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(EmulonX VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          $tag = (Select-String -Path CMakeLists.txt -Pattern 'set\(EMX_VERSION_TAG "([a-z0-9]*)"\)').Matches[0].Groups[1].Value
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source }
          Write-Output "Inno Setup: $iscc  version: $v"
          & $iscc "/DAppVersion=$v$tag" "/DNumericVersion=$v" "/DSourceDir=$((Resolve-Path dist).Path)" installer\EmulonX.iss 2>&1 | Tee-Object -FilePath installer.log
          if ($LASTEXITCODE -ne 0) {
            $t = ((Get-Content installer.log -Tail 30) -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error title=Installer failed::$t"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: EmulonX-Windows-Installer
          path: installer-out/EmulonX-Setup-*.exe

      - name: Emulon X Hub (launcher) - self-test and files
        shell: pwsh
        run: |
          $exe = "build/EmulonXHub_artefacts/Release/Emulon X Hub.exe"
          python tools/hubtest/make_source.py hubtest-source . "sd-selftest/SD Self Test.emxd"
          $env:EMX_HUB_SOURCE = (Resolve-Path hubtest-source).Path
          $env:EMX_HUB_TEST_SKIN = (Resolve-Path "sd-selftest/SD Self Test.emxd").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test", "hub-selftest" -Wait -PassThru -RedirectStandardOutput hub-selftest.log
          Get-Content hub-selftest.log
          if ($p.ExitCode -ne 0) { Write-Output "::error title=Emulon X Hub self-test failed::$((Select-String -Path hub-selftest.log -Pattern '^FAIL' | ForEach-Object { $_.Line }) -join ' / ')"; $failed = $true }
          New-Item -ItemType Directory -Force hub-dist | Out-Null
          Copy-Item $exe "hub-dist/Emulon X Hub.exe"
          Copy-Item LICENSE hub-dist/
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EmulonX-Hub-Screenshots
          path: hub-selftest/*.png

      - name: Build Emulon X SD and Hub installers
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source }
          foreach ($app in @(@{ name = 'SD'; var = 'EMX_SD_VERSION'; iss = 'EmulonXSD.iss'; dir = 'sd-dist' }, @{ name = 'Hub'; var = 'EMX_HUB_VERSION'; iss = 'EmulonXHub.iss'; dir = 'hub-dist' })) {
            $v = (Select-String -Path CMakeLists.txt -Pattern ('set\(' + $app.var + ' "([^"]+)"\)')).Matches[0].Groups[1].Value
            $num = ($v -replace '[^0-9.]', '').Trim('.')
            Write-Output "Emulon X $($app.name): $v"
            & $iscc "/DAppVersion=$v" "/DNumericVersion=$num" "/DSourceDir=$((Resolve-Path $app.dir).Path)" "installer\$($app.iss)" 2>&1 | Tee-Object -FilePath "installer-$($app.name).log"
            if ($LASTEXITCODE -ne 0) {
              $t = ((Get-Content "installer-$($app.name).log" -Tail 30) -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              Write-Output "::error title=$($app.name) installer failed::$t"; exit 1 }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: EmulonX-SD-Windows-Installer
          path: installer-out/EmulonX-SD-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: EmulonX-Hub-Windows-Installer
          path: installer-out/EmulonX-Hub-Setup-*.exe

      # Test builds: every push to main keeps a DRAFT release up to date for each program whose version
      # isn't released yet (e.g. hub-v0.2af after the version number went up). Drafts are only visible to
      # people who can change the repository; the Hub shows them in dev mode as "Install test build".
      # Publishing the draft on GitHub creates the tag and makes it the real release.
      - name: Test builds (draft releases, main branch only)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Version($pattern) { (Select-String -Path CMakeLists.txt -Pattern $pattern).Matches[0].Groups[1].Value }
          $emx = (Version 'project\(EmulonX VERSION (\d+\.\d+\.\d+)') + (Version 'set\(EMX_VERSION_TAG "([a-z0-9]*)"\)')
          $sd = Version 'set\(EMX_SD_VERSION "([^"]+)"\)'
          $hub = Version 'set\(EMX_HUB_VERSION "([^"]+)"\)'
          $list = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          # clean up broken test-build drafts from an earlier version of this step (they lost their tag name)
          foreach ($r in $list) {
            if ($r.draft -and $r.tag_name -like 'untagged-*' -and $r.assets.Count -gt 0 -and ($r.assets | Where-Object { $_.name -notlike 'EmulonX-*Setup-*.exe' }).Count -eq 0) {
              gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($r.id)" | Out-Null
              Write-Output "removed the broken draft $($r.tag_name)"
            }
          }
          foreach ($t in @(@{ tag = "v$emx"; title = "Emulon X $emx"; file = "installer-out/EmulonX-Setup-$emx.exe" },
                           @{ tag = "sd-v$sd"; title = "Emulon X SD $sd"; file = "installer-out/EmulonX-SD-Setup-$sd.exe" },
                           @{ tag = "hub-v$hub"; title = "Emulon X Hub $hub"; file = "installer-out/EmulonX-Hub-Setup-$hub.exe" })) {
            $rel = $list | Where-Object { $_.tag_name -eq $t.tag } | Select-Object -First 1
            if ($rel -and -not $rel.draft) { Write-Output "$($t.tag) is already released - no test build"; continue }
            if (-not (Test-Path $t.file)) { Write-Output "missing $($t.file)"; continue }
            $notes = "Test build from $env:GITHUB_SHA. Only people who can change this repository see it (the Emulon X Hub shows it in dev mode). Publish this release when it's ready - that creates the tag and everyone gets it."
            if ($rel) {
              # keep the tag name in the edit (GitHub turns a draft "untagged" otherwise), then swap the installer
              gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($rel.id)" -f tag_name=$($t.tag) -f target_commitish=$env:GITHUB_SHA | Out-Null
              $name = Split-Path $t.file -Leaf
              foreach ($a in $rel.assets) { if ($a.name -eq $name) { gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($a.id)" | Out-Null } }
              gh api -X POST "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($rel.id)/assets?name=$name" -H "Content-Type: application/octet-stream" --input $t.file | Out-Null
            } else {
              gh release create $t.tag $t.file --draft --prerelease --title $t.title --notes $notes --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY
            }
            Write-Output "test build: $($t.tag)"
          }
          exit 0

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EmulonX-Windows.zip
            installer-out/EmulonX-Setup-*.exe

      - name: Publish Emulon X SD release (sd-v tags only)
        if: startsWith(github.ref, 'refs/tags/sd-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Emulon X SD ${{ github.ref_name }}
          prerelease: true
          files: installer-out/EmulonX-SD-Setup-*.exe

      - name: Publish Emulon X Hub release (hub-v tags only)
        if: startsWith(github.ref, 'refs/tags/hub-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Emulon X Hub ${{ github.ref_name }}
          prerelease: true
          files: installer-out/EmulonX-Hub-Setup-*.exe

  macos:
    name: macOS (VST3 + AU + Standalone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.4-macos-v2

      - name: Configure
        run: |
          set -o pipefail
          if ! cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DEMX_BUILD_TESTS=ON 2>&1 | tee configure.log; then
            echo "::error title=Configure failed::$(tail -40 configure.log | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"; exit 1; fi

      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 2>&1 | tee build.log; then
            echo "::error title=Build failed::$(grep -E 'error:|error [A-Z]|CMake Error' build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"; exit 1; fi

      - name: Engine tests
        run: |
          set -o pipefail
          if ! build/EmulonXTests_artefacts/Release/EmulonXTests 2>&1 | tee tests.log; then
            echo "::error title=Engine tests failed::$(grep '^FAIL' tests.log | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"; exit 1; fi

      - name: Collect files
        run: |
          mkdir -p dist
          cp -R "build/EmulonX_artefacts/Release/VST3/Emulon X.vst3" dist/
          cp -R "build/EmulonX_artefacts/Release/AU/Emulon X.component" dist/
          cp -R "build/EmulonX_artefacts/Release/Standalone/Emulon X.app" dist/
          cp README.md LICENSE dist/
          ditto -c -k --sequesterRsrc --keepParent dist EmulonX-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EmulonX-macOS
          path: dist/

      - name: Emulon X SD (skin designer) files
        run: |
          mkdir -p sd-dist
          cp -R "build/EmulonXSD_artefacts/Release/Emulon X SD.app" sd-dist/
          cp LICENSE sd-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: EmulonX-SD-macOS
          path: sd-dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EmulonX-macOS.zip

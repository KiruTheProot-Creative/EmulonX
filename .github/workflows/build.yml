# Builds Emulon X in the cloud on every push.
# Download the finished plugin from the run's "Artifacts" section on GitHub.
# Pushing a tag like v0.1.0 also publishes a GitHub Release with the downloads.
name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    # Editing the launcher's texts and pictures (the hub folder) doesn't need a new build.
    paths-ignore: [ "hub/**" ]
  pull_request:
    paths-ignore: [ "hub/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.4-windows-v2

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DEMX_BUILD_TESTS=ON 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $t = ((Get-Content configure.log -Tail 40) -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error title=Configure failed::$t"; exit 1 }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Select-String -Path build.log -Pattern ' error |error C|error LNK|CMake Error' | Select-Object -First 40 | ForEach-Object { $_.Line }
            $t = ($lines -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error title=Build failed::$t"; exit 1 }

      - name: Engine tests
        shell: pwsh
        run: |
          & "build/EmulonXTests_artefacts/Release/EmulonXTests.exe" 2>&1 | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -ne 0) {
            $t = ((Select-String -Path tests.log -Pattern '^FAIL' | ForEach-Object { $_.Line }) -join "`n").Replace('%','%25').Replace("`n",'%0A')
            Write-Output "::error title=Engine tests failed::$t"; exit 1 }
          & "build/EmulonXTests_artefacts/Release/EmulonXTests.exe" --bench

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/EmulonX_artefacts/Release/VST3/Emulon X.vst3" "dist/Emulon X.vst3"
          Copy-Item "build/EmulonX_artefacts/Release/Standalone/Emulon X.exe" "dist/Emulon X.exe"
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath EmulonX-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EmulonX-Windows
          path: dist/

      - name: Emulon X SD (skin designer) - self-test and files
        shell: pwsh
        run: |
          $exe = "build/EmulonXSD_artefacts/Release/Emulon X SD.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test", "sd-selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Output "::error title=Emulon X SD self-test failed::exit code $($p.ExitCode) - see the EmulonX-SD-Screenshots artifact"; $failed = $true }
          New-Item -ItemType Directory -Force sd-dist | Out-Null
          Copy-Item $exe "sd-dist/Emulon X SD.exe"
          Copy-Item LICENSE sd-dist/
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: EmulonX-SD-Windows
          path: sd-dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EmulonX-SD-Screenshots
          path: sd-selftest/

      - name: Build installer
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(EmulonX VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          $tag = (Select-String -Path CMakeLists.txt -Pattern 'set\(EMX_VERSION_TAG "([a-z0-9]*)"\)').Matches[0].Groups[1].Value
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source }
          Write-Output "Inno Setup: $iscc  version: $v"
          & $iscc "/DAppVersion=$v$tag" "/DNumericVersion=$v" "/DSourceDir=$((Resolve-Path dist).Path)" installer\EmulonX.iss 2>&1 | Tee-Object -FilePath installer.log
          if ($LASTEXITCODE -ne 0) {
            $t = ((Get-Content installer.log -Tail 30) -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error title=Installer failed::$t"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: EmulonX-Windows-Installer
          path: installer-out/*.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EmulonX-Windows.zip
            installer-out/*.exe

  macos:
    name: macOS (VST3 + AU + Standalone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.4-macos-v2

      - name: Configure
        run: |
          set -o pipefail
          if ! cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DEMX_BUILD_TESTS=ON 2>&1 | tee configure.log; then
            echo "::error title=Configure failed::$(tail -40 configure.log | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"; exit 1; fi

      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 2>&1 | tee build.log; then
            echo "::error title=Build failed::$(grep -E 'error:|error [A-Z]|CMake Error' build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"; exit 1; fi

      - name: Engine tests
        run: |
          set -o pipefail
          if ! build/EmulonXTests_artefacts/Release/EmulonXTests 2>&1 | tee tests.log; then
            echo "::error title=Engine tests failed::$(grep '^FAIL' tests.log | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"; exit 1; fi

      - name: Collect files
        run: |
          mkdir -p dist
          cp -R "build/EmulonX_artefacts/Release/VST3/Emulon X.vst3" dist/
          cp -R "build/EmulonX_artefacts/Release/AU/Emulon X.component" dist/
          cp -R "build/EmulonX_artefacts/Release/Standalone/Emulon X.app" dist/
          cp README.md LICENSE dist/
          ditto -c -k --sequesterRsrc --keepParent dist EmulonX-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EmulonX-macOS
          path: dist/

      - name: Emulon X SD (skin designer) files
        run: |
          mkdir -p sd-dist
          cp -R "build/EmulonXSD_artefacts/Release/Emulon X SD.app" sd-dist/
          cp LICENSE sd-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: EmulonX-SD-macOS
          path: sd-dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EmulonX-macOS.zip
